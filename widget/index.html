<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHATBOX-IA — WhatsApp Widget</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="widget-container" class="theme-dark">

    <!-- En-tête style WhatsApp -->
    <div id="wa-header">
      <button class="wa-icon-btn wa-back-btn" aria-label="Retour">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </button>

      <div class="wa-avatar-wrap">
        <div class="wa-avatar" id="wa-avatar">
          <svg viewBox="0 0 212 212" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path fill-rule="evenodd" clip-rule="evenodd"
              d="M106 0C47.4 0 0 47.4 0 106C0 164.6 47.4 212 106 212C164.6 212 212 164.6 212 106C212 47.4 164.6 0 106 0ZM106 22.4C127.3 22.4 144.8 39.9 144.8 61.2C144.8 82.5 127.3 100 106 100C84.7 100 67.2 82.5 67.2 61.2C67.2 39.9 84.7 22.4 106 22.4ZM106 189.6C79.5 189.6 56 177.3 40.6 158.2C41.2 135.3 87.3 122.8 106 122.8C124.6 122.8 170.8 135.3 171.4 158.2C156 177.3 132.5 189.6 106 189.6Z"
              fill="#8696A0"/>
          </svg>
        </div>
        <div class="wa-online-dot" id="connection-dot" title="Non connecté"></div>
      </div>

      <div class="wa-contact-info">
        <div class="wa-contact-name" id="contact-name">Tchat Stream</div>
        <div class="wa-contact-status">en ligne</div>
      </div>

      <div class="wa-header-actions">
        <button class="wa-icon-btn" aria-label="Appel vidéo">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
        </button>
        <button class="wa-icon-btn" aria-label="Appel">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
        </button>
        <button class="wa-icon-btn" aria-label="Options">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
        </button>
      </div>
    </div>

    <!-- Objectif d'abonnements -->
    <div id="sub-goal">
      <div class="goal-accent"></div>
      <div class="goal-body">
        <div class="goal-top-row">
          <span class="goal-icon">🎯</span>
          <span class="goal-label" id="goal-label">Objectif abonnements</span>
          <span class="goal-fraction" id="goal-fraction">0 / 100</span>
        </div>
        <div class="goal-desc" id="goal-desc"></div>
        <div class="goal-track">
          <div class="goal-fill" id="goal-fill"></div>
          <div class="goal-shine"></div>
        </div>
      </div>
    </div>

    <!-- Zone de messages -->
    <div id="messages-container">
      <div class="chat-bg-pattern"></div>
      <div id="messages-list"></div>
    </div>

    <!-- Barre de saisie (décorative) -->
    <div id="wa-input-bar">
      <button class="wa-icon-btn" aria-label="Emoji">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"/></svg>
      </button>
      <div class="wa-input-field">
        <span>Message…</span>
      </div>
      <button class="wa-icon-btn" aria-label="Joindre un fichier">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/></svg>
      </button>
      <button class="wa-mic-btn" aria-label="Microphone">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg>
      </button>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
